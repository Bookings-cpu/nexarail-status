<!doctype html><html><body>
<script type="module">
import { SigningStargateClient, GasPrice } from "https://esm.sh/@cosmjs/stargate@0.32.4?bundle";
import { DirectSecp256k1HdWallet } from "https://esm.sh/@cosmjs/proto-signing@0.32.4?bundle";

window.__log = [];
function log(msg) { window.__log.push(msg); console.log(msg); }

try {
  log('generating wallet...');
  const wallet = await DirectSecp256k1HdWallet.generate(24, { prefix: 'nxr' });
  log('wallet generated ok');
  const accounts = await wallet.getAccounts();
  log('got accounts: ' + accounts[0].address);

  log('connecting to RPC...');
  const client = await SigningStargateClient.connectWithSigner(
    'https://5-161-72-48.nip.io/rpc',
    wallet,
    { gasPrice: GasPrice.fromString('0.001unxrl') }
  );
  log('connected ok');

  log('querying balance...');
  const bal = await client.getBalance(accounts[0].address, 'unxrl');
  log('balance query ok: ' + JSON.stringify(bal));

  window.__finalResult = { ok: true, address: accounts[0].address };
} catch(e) {
  log('ERROR: ' + (e && e.stack || e));
  window.__finalResult = { ok: false, error: String(e && e.stack || e) };
}
window.__done = true;
</script>
</body></html>
